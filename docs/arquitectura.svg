<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4354"/>
    </marker>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2541f"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#3d4354;stroke-width:1.5}
      .svc{fill:#eef4fb;stroke:#2a78d6;stroke-width:1.5}
      .gw{fill:#e7f3ee;stroke:#1f6f5c;stroke-width:2}
      .db{fill:#f5f3ee;stroke:#6b6656;stroke-width:1.5}
      .bus{fill:#fdf0e9;stroke:#c2541f;stroke-width:1.8}
      .t{font-size:15px;font-weight:700;fill:#1d2433}
      .s{font-size:12px;fill:#4a5062}
      .l{font-size:11.5px;fill:#3d4354}
      .le{font-size:11.5px;fill:#a2451a;font-weight:600}
      .ln{stroke:#3d4354;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .ev{stroke:#c2541f;stroke-width:2;fill:none;marker-end:url(#ae);stroke-dasharray:7 4}
    </style>
  </defs>
  <rect width="1380" height="900" fill="#fbfbfa"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1d2433">DistriMarket — Arquitectura distribuida de microservicios</text>

  <!-- Frontera de red interna -->
  <rect x="265" y="60" width="1090" height="800" rx="14" fill="none" stroke="#8a90a0" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="285" y="84" class="s" font-weight="600">Red interna Docker «backend» — único puerto expuesto: 8000 (API Gateway)</text>

  <!-- Cliente -->
  <rect x="30" y="380" width="190" height="110" rx="10" class="box"/>
  <text x="125" y="415" text-anchor="middle" class="t">Cliente web</text>
  <text x="125" y="437" text-anchor="middle" class="s">Navegador (HTML/JS)</text>
  <text x="125" y="456" text-anchor="middle" class="s">Clientes REST / pruebas</text>
  <text x="125" y="475" text-anchor="middle" class="s">Idempotency-Key</text>

  <!-- Gateway -->
  <rect x="300" y="300" width="230" height="270" rx="10" class="gw"/>
  <text x="415" y="332" text-anchor="middle" class="t">API Gateway</text>
  <text x="415" y="352" text-anchor="middle" class="s">FastAPI · :8000</text>
  <text x="318" y="384" class="s">• Enrutamiento /api/*</text>
  <text x="318" y="405" class="s">• Validación JWT (HS256)</text>
  <text x="318" y="426" class="s">• Rate limiting (Redis)</text>
  <text x="318" y="447" class="s">• Balanceo round-robin</text>
  <text x="318" y="468" class="s">• Circuit breaker por instancia</text>
  <text x="318" y="489" class="s">• Timeouts + reintentos</text>
  <text x="318" y="510" class="s">• Cabeceras de seguridad, CSP</text>
  <text x="318" y="531" class="s">• X-Request-ID (trazabilidad)</text>
  <text x="318" y="552" class="s">• Panel /api-status</text>

  <!-- Servicios -->
  <rect x="650" y="100" width="240" height="70" rx="10" class="svc"/>
  <text x="770" y="130" text-anchor="middle" class="t">auth-service</text>
  <text x="770" y="151" text-anchor="middle" class="s">registro · login · bcrypt · JWT</text>

  <rect x="650" y="215" width="240" height="62" rx="10" class="svc"/>
  <text x="770" y="242" text-anchor="middle" class="t">inventory-service #1</text>
  <text x="770" y="262" text-anchor="middle" class="s">catálogo · reserva atómica</text>
  <rect x="650" y="300" width="240" height="62" rx="10" class="svc"/>
  <text x="770" y="327" text-anchor="middle" class="t">inventory-service #2</text>
  <text x="770" y="347" text-anchor="middle" class="s">réplica sin estado</text>

  <rect x="650" y="470" width="240" height="80" rx="10" class="svc"/>
  <text x="770" y="499" text-anchor="middle" class="t">orders-service</text>
  <text x="770" y="519" text-anchor="middle" class="s">Saga + compensación</text>
  <text x="770" y="537" text-anchor="middle" class="s">Transactional Outbox + relay</text>

  <rect x="650" y="690" width="240" height="80" rx="10" class="svc"/>
  <text x="770" y="719" text-anchor="middle" class="t">notifications-service</text>
  <text x="770" y="739" text-anchor="middle" class="s">consumer group · idempotente</text>
  <text x="770" y="757" text-anchor="middle" class="s">XAUTOCLAIM · DLQ</text>

  <!-- Bases de datos (cilindros) -->
  <g class="db">
    <path d="M1070,105 v50 a85,12 0 0 0 170,0 v-50"/><ellipse cx="1155" cy="105" rx="85" ry="12"/>
    <path d="M1070,258 v62 a85,12 0 0 0 170,0 v-62"/><ellipse cx="1155" cy="258" rx="85" ry="12"/>
    <path d="M1070,478 v62 a85,12 0 0 0 170,0 v-62"/><ellipse cx="1155" cy="478" rx="85" ry="12"/>
    <path d="M1070,698 v62 a85,12 0 0 0 170,0 v-62"/><ellipse cx="1155" cy="698" rx="85" ry="12"/>
  </g>
  <text x="1155" y="140" text-anchor="middle" class="t" font-size="14">auth_db</text>
  <text x="1155" y="158" text-anchor="middle" class="s">users</text>
  <text x="1155" y="295" text-anchor="middle" class="t" font-size="14">inventory_db</text>
  <text x="1155" y="313" text-anchor="middle" class="s">products · reservations</text>
  <text x="1155" y="515" text-anchor="middle" class="t" font-size="14">orders_db</text>
  <text x="1155" y="533" text-anchor="middle" class="s">orders · outbox</text>
  <text x="1155" y="735" text-anchor="middle" class="t" font-size="14">notifications_db</text>
  <text x="1155" y="753" text-anchor="middle" class="s">notifications</text>
  <text x="1155" y="808" text-anchor="middle" class="s" font-weight="600">PostgreSQL 16 — una base de datos por servicio</text>

  <!-- Broker -->
  <rect x="300" y="690" width="230" height="110" rx="10" class="bus"/>
  <text x="415" y="722" text-anchor="middle" class="t">Redis 7</text>
  <text x="415" y="744" text-anchor="middle" class="s">Stream «distrimarket.events»</text>
  <text x="415" y="763" text-anchor="middle" class="s">+ contadores de rate limiting</text>
  <text x="415" y="782" text-anchor="middle" class="s">persistencia AOF</text>

  <!-- Cliente -> Gateway -->
  <path d="M220,435 H298" class="ln"/>
  <text x="226" y="425" class="l">HTTP/REST</text><text x="226" y="452" class="l">JSON+JWT</text>

  <!-- Gateway -> servicios -->
  <path d="M530,330 C590,330 590,135 648,135" class="ln"/>
  <path d="M530,380 C595,380 595,246 648,246" class="ln"/>
  <path d="M530,400 C600,400 600,331 648,331" class="ln"/>
  <path d="M530,480 C590,480 590,505 648,505" class="ln"/>
  <path d="M530,540 C600,540 600,715 648,715" class="ln"/>
  <text x="300" y="290" class="l">REST síncrono (proxy inverso)</text>

  <!-- orders -> inventory -->
  <path d="M800,470 V364" class="ln"/>
  <text x="810" y="400" class="l">REST interno + X-Internal-Token</text>
  <text x="810" y="416" class="l">failover entre réplicas,</text>
  <text x="810" y="432" class="l">CB + backoff, timeout 2 s</text>

  <!-- servicios -> BD -->
  <path d="M890,135 H1068" class="ln"/>
  <path d="M890,246 C980,246 980,285 1068,285" class="ln"/>
  <path d="M890,331 C980,331 980,300 1068,300" class="ln"/>
  <path d="M890,510 H1068" class="ln"/>
  <path d="M890,730 H1068" class="ln"/>
  <text x="930" y="125" class="l">asyncpg (TCP 5432)</text>

  <!-- Eventos -->
  <path d="M650,535 C560,560 470,620 440,688" class="ev"/>
  <text x="612" y="612" class="le">XADD order.*</text>
  <text x="612" y="627" class="le">(relay del outbox)</text>
  <path d="M530,760 C580,760 600,745 648,745" class="ev"/>
  <text x="545" y="790" class="le">XREADGROUP / XACK</text>
  <path d="M390,570 V688" class="ln"/>
  <text x="300" y="630" class="l">INCR</text><text x="300" y="645" class="l">rate limit</text>

  <!-- Leyenda -->
  <g transform="translate(30,560)">
    <rect width="210" height="132" rx="8" fill="#fff" stroke="#d5d8e0"/>
    <text x="14" y="24" class="s" font-weight="700">Leyenda</text>
    <path d="M14,46 H70" class="ln"/><text x="80" y="50" class="l">Llamada síncrona</text>
    <path d="M14,72 H70" class="ev"/><text x="80" y="76" class="l">Evento asíncrono</text>
    <rect x="14" y="88" width="22" height="14" class="svc"/><text x="44" y="100" class="l">Microservicio</text>
    <rect x="120" y="88" width="22" height="14" class="db"/><text x="148" y="100" class="l">Datos</text>
    <text x="14" y="122" class="l">CB = circuit breaker</text>
  </g>
</svg>
